<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — 🎬 Подбор фильма</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #16213e; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
    h1 { text-align: center; color: #e94560; margin-bottom: 28px; font-size: 24px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; margin-top: 16px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #0f0f23; color: #eee; font-size: 15px; }
    input:focus { outline: none; border-color: #e94560; }
    button { width: 100%; margin-top: 24px; padding: 13px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #c73652; }
    .error { background: #3a1a1a; color: #ff6b6b; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .link { text-align: center; margin-top: 18px; font-size: 14px; color: #aaa; }
    .link a { color: #e94560; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 Вход</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>

      <label>Пароль</label>
      <input type="password" name="password" placeholder="Ваш пароль" required>

      <button type="submit">Войти</button>
    </form>

    <div class="link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
  </div>
</body>
</html>
